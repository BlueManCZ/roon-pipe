name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with Node 22.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Published with npm rather than pnpm: pnpm 11 has an open OIDC regression
      # (https://github.com/pnpm/pnpm/issues/11513). Under trusted publishing npm
      # authenticates via OIDC and attaches provenance automatically, so no
      # NODE_AUTH_TOKEN secret and no --provenance flag are needed.
      - name: Publish
        run: npm publish
